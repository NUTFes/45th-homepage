[tools]
node = "24"
pnpm = "10"

# ============================================================
# 10s: 開発環境の基本操作 (Development Basics)
# ============================================================

[tasks."10:up"]
description = "開発用コンテナを起動する"
alias = "up"
run = "docker compose up -d"

[tasks."11:down"]
description = "開発用コンテナを停止して削除する"
alias = "down"
run = "docker compose down"

[tasks."12:logs"]
description = "開発用コンテナのログをリアルタイム表示する"
alias = "logs"
run = "docker compose logs -f"

[tasks."13:sh"]
description = "payloadコンテナ内に入ってシェルを実行する"
alias = "sh"
run = "docker compose exec payload sh"

# ============================================================
# 20s: パッケージ管理 (Package Management)
# ============================================================

[tasks."20:install"]
description = "手元とコンテナの両方で依存関係をインストールする"
alias = ["install", "i"]
run = ["pnpm install", "docker compose exec payload pnpm install"]

[tasks."21:add"]
description = "パッケージを追加する"
alias = "add"
usage = '''
  arg "<packages>" var=#true help="追加するパッケージ名（複数可）"
  flag "-D --dev" help="開発用依存として追加"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [[ "${usage_dev:-false}" == "true" ]]; then
  pnpm add -D ${usage_packages?}
else
  pnpm add ${usage_packages?}
fi

docker compose exec payload pnpm install
'''

[tasks."22:rm"]
description = "パッケージを削除する"
alias = ["rm", "remove"]
usage = 'arg "<packages>" var=#true help="削除するパッケージ名（複数可）"'
run = '''
#!/usr/bin/env bash
set -euo pipefail

pnpm rm ${usage_packages?}

docker compose exec payload pnpm install
'''

# ============================================================
# 30s: データベース・マイグレーション (Database Migrations)
# ============================================================

[tasks."30:migrate:create"]
description = "スキーマ変更からマイグレーションファイルを生成する"
alias = ["migrate:create", "mc"]
usage = 'arg "<name>" help="Name of the migration"'
run = "docker compose exec payload pnpm payload migrate:create ${usage_name?}"

[tasks."31:migrate:status"]
description = "マイグレーションの実行状況を確認する"
alias = ["migrate:status", "ms"]
run = "docker compose exec payload pnpm payload migrate:status"

[tasks."32:migrate"]
description = "保留中のマイグレーションを開発用コンテナで手動実行する"
alias = ["migrate", "m"]
run = "docker compose exec payload pnpm payload migrate"

# ============================================================
# 90s: 本番環境の運用操作 (Production Operations)
# ============================================================

[tasks."90:prod:ps"]
description = "本番用コンテナの状態を表示する"
alias = "prod:ps"
run = "docker compose --env-file .env.production --env-file .env.release -f compose.prod.yml ps"

[tasks."91:prod:logs"]
description = "本番用コンテナのログを表示する"
alias = "prod:logs"
run = "docker compose --env-file .env.production --env-file .env.release -f compose.prod.yml logs -f"

[tasks."92:prod:stop"]
description = "Cloudflare TunnelとPayloadを停止する"
alias = "prod:stop"
run = "docker compose --env-file .env.production --env-file .env.release -f compose.prod.yml stop cloudflared payload"

[tasks."93:prod:backup"]
description = "停止中のPayloadに対してPostgreSQLとmediaをbackupする"
alias = "prod:backup"
run = "scripts/prod/backup.sh"

[tasks."94:prod:migrate"]
description = "停止中の本番環境へPayload DBスキーママイグレーションを明示実行する"
alias = "prod:migrate"
run = '''
#!/usr/bin/env bash
set -euo pipefail

compose=(docker compose --env-file .env.production --env-file .env.release -f compose.prod.yml)

inspect_value() {
  local field="$1"
  local object="$2"
  docker inspect "$object" |
    INSPECT_FIELD="$field" node -e '
      const fs = require("node:fs");
      const [document] = JSON.parse(fs.readFileSync(0, "utf8"));
      const value = process.env.INSPECT_FIELD
        .split(".")
        .reduce((current, key) => current?.[key], document);
      if (typeof value !== "string" || value.length === 0) process.exit(1);
      process.stdout.write(value);
    '
}

for service in payload cloudflared; do
  container_id="$("${compose[@]}" ps -a -q "$service")"
  if [[ -z "$container_id" ]]; then
    continue
  fi

  state="$(inspect_value State.Status "$container_id")"
  if [[ "$state" != "exited" && "$state" != "created" ]]; then
    echo "Stop payload and cloudflared before migration: mise run prod:stop" >&2
    exit 1
  fi
done

for service in postgres seaweedfs-s3; do
  container_id="$("${compose[@]}" ps --status running -q "$service")"
  if [[ -z "$container_id" ]]; then
    echo "$service must already be running" >&2
    exit 1
  fi

  health="$(inspect_value State.Health.Status "$container_id")"
  if [[ "$health" != "healthy" ]]; then
    echo "$service is not healthy: $health" >&2
    exit 1
  fi
done

"${compose[@]}" --profile tools run --rm --no-deps payload-migrate
'''

[tasks."95:prod:start-app"]
description = "現在のrelease imageで単一のPayloadを起動する"
alias = "prod:start-app"
run = "docker compose --env-file .env.production --env-file .env.release -f compose.prod.yml up -d --no-deps --wait --wait-timeout 120 payload"

[tasks."96:prod:start-tunnel"]
description = "記録済みのhealthyなPayloadに対してTunnelを起動する"
alias = "prod:start-tunnel"
run = '''
#!/usr/bin/env bash
set -euo pipefail

compose=(docker compose --env-file .env.production --env-file .env.release -f compose.prod.yml)

inspect_value() {
  local field="$1"
  local object="$2"
  docker inspect "$object" |
    INSPECT_FIELD="$field" node -e '
      const fs = require("node:fs");
      const [document] = JSON.parse(fs.readFileSync(0, "utf8"));
      const value = process.env.INSPECT_FIELD
        .split(".")
        .reduce((current, key) => current?.[key], document);
      if (typeof value !== "string" || value.length === 0) process.exit(1);
      process.stdout.write(value);
    '
}
payload_id="$("${compose[@]}" ps --status running -q payload)"
if [[ -z "$payload_id" ]]; then
  echo "The recorded Payload release must already be running" >&2
  exit 1
fi

health="$(inspect_value State.Health.Status "$payload_id")"
if [[ "$health" != "healthy" ]]; then
  echo "Payload is not healthy: $health" >&2
  exit 1
fi

recorded_image="$(
  "${compose[@]}" config --format json --no-env-resolution |
    node -e '
      const fs = require("node:fs");
      const config = JSON.parse(fs.readFileSync(0, "utf8"));
      process.stdout.write(config.services.payload.image ?? "");
    '
)"
if [[ -z "$recorded_image" ]]; then
  echo "Cannot resolve the recorded Payload image" >&2
  exit 1
fi

recorded_image_id="$(inspect_value Id "$recorded_image")"
running_image_id="$(inspect_value Image "$payload_id")"
if [[ "$recorded_image_id" != "$running_image_id" ]]; then
  echo "Running Payload does not match .env.release: $recorded_image" >&2
  exit 1
fi

"${compose[@]}" up -d --no-deps cloudflared
'''

[tasks."97:prod:deploy"]
description = "checkout済みのmainを本番環境へ停止を伴って直列デプロイする"
alias = "prod:deploy"
run = "scripts/prod/deploy.sh"

[tasks."98:prod:perf"]
description = "本番相当のDocker環境でLighthouseを実行する (.env.productionを使用)"
alias = "prod:perf"
run = '''
#!/usr/bin/env bash
set -euo pipefail

compose=(docker compose --env-file .env.production -f compose.perf.yml)
"${compose[@]}" build payload lighthouse
"${compose[@]}" up -d --wait postgres seaweedfs-s3
"${compose[@]}" --profile tools run --rm --no-deps payload-migrate
"${compose[@]}" up --abort-on-container-exit --exit-code-from lighthouse payload lighthouse
'''

[tasks."99:prod:perf:down"]
description = "Lighthouse性能試験用コンテナを停止して削除する"
alias = "prod:perf:down"
run = "docker compose --env-file .env.production -f compose.perf.yml down"
