[tools]
node = "24"
pnpm = "10"

# ============================================================
# 10s: 開発環境の基本操作 (Development Basics)
# ============================================================

[tasks."10:up"]
description = "開発用コンテナを起動する"
alias = "up"
run = "docker compose up -d"

[tasks."11:down"]
description = "開発用コンテナを停止して削除する"
alias = "down"
run = "docker compose down"

[tasks."12:logs"]
description = "開発用コンテナのログをリアルタイム表示する"
alias = "logs"
run = "docker compose logs -f"

[tasks."13:sh"]
description = "payloadコンテナ内に入ってシェルを実行する"
alias = "sh"
run = "docker compose exec payload sh"

# ============================================================
# 20s: パッケージ管理 (Package Management)
# ============================================================

[tasks."20:install"]
description = "手元とコンテナの両方で依存関係をインストールする"
alias = ["install", "i"]
run = ["pnpm install", "docker compose exec payload pnpm install"]

[tasks."21:add"]
description = "パッケージを追加する"
alias = "add"
usage = '''
  arg "<packages>" var=#true help="追加するパッケージ名（複数可）"
  flag "-D --dev" help="開発用依存として追加"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

if [[ "${usage_dev:-false}" == "true" ]]; then
  pnpm add -D ${usage_packages?}
else
  pnpm add ${usage_packages?}
fi

docker compose exec payload pnpm install
'''

[tasks."22:rm"]
description = "パッケージを削除する"
alias = ["rm", "remove"]
usage = 'arg "<packages>" var=#true help="削除するパッケージ名（複数可）"'
run = '''
#!/usr/bin/env bash
set -euo pipefail

pnpm rm ${usage_packages?}

docker compose exec payload pnpm install
'''

# ============================================================
# 30s: データベース・マイグレーション (Database Migrations)
# ============================================================

[tasks."30:migrate:create"]
description = "スキーマ変更からマイグレーションファイルを生成する"
alias = ["migrate:create", "mc"]
usage = 'arg "<name>" help="Name of the migration"'
run = "docker compose exec payload pnpm payload migrate:create ${usage_name?}"

[tasks."31:migrate:status"]
description = "マイグレーションの実行状況を確認する"
alias = ["migrate:status", "ms"]
run = "docker compose exec payload pnpm payload migrate:status"

[tasks."32:migrate"]
description = "保留中のマイグレーションを手動で実行する (開発・保守用)"
alias = ["migrate", "m"]
run = "docker compose exec payload pnpm payload migrate"

# ============================================================
# 90s: 本番環境の運用操作 (Production Operations)
# ============================================================

[tasks."90:prod:up"]
description = "本番へdigest固定イメージを直列デプロイする"
alias = "prod:up"
run = "./scripts/deploy-production.sh"

[tasks."91:prod:down"]
description = "本番用コンテナを停止して削除する"
alias = "prod:down"
run = "docker compose --project-name 45th-homepage --env-file .env.production --env-file .env.production.images -f compose.prod.yml down"

[tasks."92:prod:logs"]
description = "本番用コンテナのログを表示する"
alias = "prod:logs"
run = "docker compose --project-name 45th-homepage --env-file .env.production --env-file .env.production.images -f compose.prod.yml logs -f"

[tasks."93:prod:ps"]
description = "本番用コンテナのステータスを表示する"
alias = "prod:ps"
run = "docker compose --project-name 45th-homepage --env-file .env.production --env-file .env.production.images -f compose.prod.yml ps"

[tasks."94:prod:deploy"]
description = "本番へdigest固定イメージを直列デプロイする"
alias = "prod:deploy"
run = "./scripts/deploy-production.sh"

[tasks."95:prod:backup"]
description = "Payloadを停止してPostgreSQLとメディアの復旧点を作成する"
alias = "prod:backup"
run = "./scripts/backup-production.sh --stop-app"

[tasks."96:prod:perf"]
description = "本番相当のDocker環境でLighthouseを実行する (.env.productionを使用)"
alias = "prod:perf"
run = '''
#!/usr/bin/env bash
set -Eeuo pipefail

compose=(
  docker compose
  --project-name 45th-homepage-perf
  --env-file .env.production
  -f compose.perf.yml
)

"${compose[@]}" down -v --remove-orphans
"${compose[@]}" build payload payload-migrate lighthouse
"${compose[@]}" up \
  -d \
  --wait \
  postgres \
  seaweedfs-master \
  seaweedfs-volume \
  seaweedfs-filer \
  seaweedfs-s3
"${compose[@]}" stop -t 30 payload
"${compose[@]}" run --rm -T --no-deps payload-migrate
"${compose[@]}" up -d --no-deps --wait --wait-timeout 180 payload
"${compose[@]}" run --rm -T --no-deps lighthouse
'''

[tasks."97:prod:perf:down"]
description = "Lighthouse性能試験用コンテナを停止して削除する"
alias = "prod:perf:down"
run = "docker compose --project-name 45th-homepage-perf --env-file .env.production -f compose.perf.yml down -v --remove-orphans"

[tasks."98:prod:restore"]
description = "検証済み復旧点からPostgreSQLと旧Payloadを復元する"
alias = "prod:restore"
usage = '''
  arg "<recovery_point>" help="BACKUP_DIR直下の復旧点directory名"
  flag "--restore-media" help="media bucketも復旧点で完全置換する"
  flag "-y --yes" help="対話確認を省略する"
'''
run = '''
#!/usr/bin/env bash
set -Eeuo pipefail

args=("${usage_recovery_point?}")
if [[ "${usage_restore_media:-false}" == "true" ]]; then
  args+=(--restore-media)
fi
if [[ "${usage_yes:-false}" == "true" ]]; then
  args+=(--yes)
fi

./scripts/restore-production.sh "${args[@]}"
'''
