pre-commit:
  piped: true # format check → lint check order
  jobs:
    - name: format check
      run: pnpm exec oxfmt --check {staged_files}
      glob: "*.{ts,tsx,js,jsx,json,jsonc,json5,yml,yaml,css,scss,less,html,md,mdx,graphql,toml}"
      exclude:
        - "src/payload-types.ts"
        - "src/app/(payload)/admin/importMap.js"
        - "src/migrations/**"
        - "node_modules/**"
        - ".next/**"
        - "pnpm-lock.yaml"
        - "skills-lock.json"
        - ".agent/**"
        - ".cursor/**"
        - ".vscode/**"

    - name: lint check
      run: pnpm exec oxlint {staged_files}
      glob: "*.{ts,tsx}"
      exclude:
        - "src/payload-types.ts"
        - "src/app/(payload)/admin/importMap.js"
        - "src/migrations/**"
