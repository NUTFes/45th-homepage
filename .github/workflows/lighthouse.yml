name: Lighthouse CI

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "測定対象および結果をコメントするPR番号（省略時は選択したrefを測定）"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.13.0"
  PNPM_VERSION: "10.28.1"
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: mysecretpassword
  POSTGRES_DB: payload
  DATABASE_URL: postgres://postgres:mysecretpassword@localhost:5432/payload
  PAYLOAD_SECRET: ci_secret_key
  S3_BUCKET: media
  S3_ENDPOINT: http://localhost:8333
  S3_ACCESS_KEY_ID: ci_access_key
  S3_SECRET_ACCESS_KEY: ci_secret_key
  NODE_ENV: production
jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: mysecretpassword
          POSTGRES_DB: payload
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d payload"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Resolve checkout ref
        id: target
        env:
          DEFAULT_REF: ${{ github.sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ -z "$PR_NUMBER" ]]; then
            ref="$DEFAULT_REF"
          elif [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            ref="refs/pull/$PR_NUMBER/merge"
          else
            echo "pr_number must be a positive integer" >&2
            exit 1
          fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.target.outputs.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Run migrations
        run: pnpm payload migrate

      - name: Build Next.js
        run: pnpm run build

      - name: Run Lighthouse CI
        id: lhci
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18
        with:
          configPath: ./lighthouserc.cjs
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Upload Lighthouse comment data
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-comment-data
          path: |
            .lighthouseci/links.json
            .lighthouseci/manifest.json
          if-no-files-found: ignore
          retention-days: 1

  comment:
    name: Comment Lighthouse results
    runs-on: ubuntu-latest
    needs: lighthouse
    if: ${{ always() && inputs.pr_number != '' }}
    permissions:
      actions: read
      pull-requests: write

    steps:
      - name: Download Lighthouse comment data
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: lighthouse-comment-data
          path: ${{ runner.temp }}/lighthouse-comment-data

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          RESULTS_PATH: ${{ runner.temp }}/lighthouse-comment-data
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const prNumber = process.env.PR_NUMBER;
            const resultsPath = process.env.RESULTS_PATH;

            if (!/^[1-9][0-9]*$/.test(prNumber)) {
              throw new Error('pr_number must be a positive integer');
            }

            const issueNumber = Number(prNumber);
            if (!Number.isSafeInteger(issueNumber)) {
              throw new Error('pr_number exceeds the safe integer range');
            }

            const marker = '## ⚡️ Lighthouse CI Results';
            let comment = `${marker}\n\n`;

            try {
              const readJson = (fileName) => {
                const filePath = path.join(resultsPath, fileName);
                const stat = fs.lstatSync(filePath);

                if (!stat.isFile() || stat.size > 1024 * 1024) {
                  throw new Error(`Invalid ${fileName}`);
                }

                return JSON.parse(fs.readFileSync(filePath, 'utf8'));
              };

              const links = readJson('links.json');
              const manifest = readJson('manifest.json');

              if (!Array.isArray(manifest) || !links || typeof links !== 'object' || Array.isArray(links)) {
                throw new Error('Invalid Lighthouse result schema');
              }

              const asHttpUrl = (value) => {
                if (typeof value !== 'string' || value.length > 2048) return null;

                try {
                  const url = new URL(value);
                  return url.protocol === 'http:' || url.protocol === 'https:' ? url.href : null;
                } catch {
                  return null;
                }
              };

              const escapeTableCell = (value) =>
                value.replaceAll('\\', '\\\\').replaceAll('|', '\\|').replace(/[\r\n]+/g, ' ');

              const fmt = (score) => {
                if (typeof score !== 'number' || !Number.isFinite(score) || score < 0 || score > 1) {
                  return '-';
                }

                const val = Math.round(score * 100);
                let icon = '🟢';
                if (val < 90) icon = '🟠';
                if (val < 50) icon = '🔴';
                return `${icon} ${val}`;
              };

              const rows = manifest
                .filter((result) => result && typeof result === 'object' && result.isRepresentativeRun === true)
                .slice(0, 50)
                .map((result) => {
                  const url = asHttpUrl(result.url);
                  if (!url) return null;

                  const link = asHttpUrl(links[result.url]);
                  const summary =
                    result.summary && typeof result.summary === 'object' && !Array.isArray(result.summary)
                      ? result.summary
                      : {};
                  const report = link ? `[View Report](<${link}>)` : '-';

                  return `| ${escapeTableCell(url)} | ${fmt(summary.performance)} | ${fmt(summary.accessibility)} | ${fmt(summary['best-practices'])} | ${fmt(summary.seo)} | ${report} |`;
                })
                .filter(Boolean);

              if (rows.length === 0) {
                throw new Error('No representative Lighthouse results');
              }

              comment += '| URL | Performance | Accessibility | Best Practices | SEO | Report |\n';
              comment += '| --- | --- | --- | --- | --- | --- |\n';
              comment += `${rows.join('\n')}\n`;
            } catch (error) {
              comment += '⚠️ Could not parse Lighthouse results.\n';
              console.error(error);
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              issue_number: issueNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const botComment = comments.find(
              (candidate) =>
                candidate.user?.type === 'Bot' &&
                typeof candidate.body === 'string' &&
                candidate.body.includes(marker),
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                comment_id: botComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: issueNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment,
              });
            }
