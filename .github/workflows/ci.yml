name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.13.0"
  PNPM_VERSION: "10.28.1"

jobs:
  quality:
    name: Quality Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Takumi Guard
        uses: flatt-security/setup-takumi-guard-npm@9a5d797c2085b6326d3a2985c08e3a114b9b88c1 # v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Oxfmt Check
        run: pnpm run fmt:check

      - name: Oxlint Check
        run: pnpm run lint

      - name: TypeScript Check
        run: pnpm run typecheck

  react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch main branch
        run: |
          if [ "$(git rev-parse --abbrev-ref HEAD)" != "main" ]; then
            git fetch origin main:main
          fi

      - name: Run React Doctor
        uses: millionco/react-doctor@1d3d514a562bbab42dcefa0badeed2e707ed7ea9
        with:
          directory: .
          project: 45th-homepage
          verbose: true
          diff: main
          fail-on: none
          node-version: ${{ env.NODE_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quality, react-doctor]
    permissions:
      contents: read
    env:
      PAYLOAD_SECRET: ci_secret_key
      DATABASE_URL: postgres://postgres:mysecretpassword@localhost:5432/payload
      S3_BUCKET: media
      S3_ENDPOINT: http://localhost:8333
      S3_ACCESS_KEY_ID: ci_access_key
      S3_SECRET_ACCESS_KEY: ci_secret_key
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Takumi Guard
        uses: flatt-security/setup-takumi-guard-npm@9a5d797c2085b6326d3a2985c08e3a114b9b88c1 # v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build
        run: pnpm run build

      - name: Build one-shot migrator image
        run: docker build --target migrator --tag 45th-homepage-migrator:ci .

      - name: Check migrator CLI packaging
        run: |
          docker run --rm \
            --env PAYLOAD_SECRET \
            --env DATABASE_URL \
            --env S3_BUCKET \
            --env S3_ENDPOINT \
            --env S3_ACCESS_KEY_ID \
            --env S3_SECRET_ACCESS_KEY \
            45th-homepage-migrator:ci \
            info

  publish-production-images:
    name: Publish Production Images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve image references
        id: refs
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        id: app
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.refs.outputs.image }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://www.nutfes.net/
          labels: |
            org.opencontainers.image.created=${{ steps.refs.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=production-app
          cache-to: type=gha,mode=max,scope=production-app

      - name: Build and push migrator image
        id: migrator
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ steps.refs.outputs.image }}:migrator-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.created=${{ steps.refs.outputs.created }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=production-migrator
          cache-to: type=gha,mode=max,scope=production-migrator

      - name: Attest application image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.refs.outputs.image }}
          subject-digest: ${{ steps.app.outputs.digest }}
          push-to-registry: true

      - name: Attest migrator image
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: ${{ steps.refs.outputs.image }}
          subject-digest: ${{ steps.migrator.outputs.digest }}
          push-to-registry: true

      - name: Build deployment bundle
        shell: bash
        env:
          IMAGE: ${{ steps.refs.outputs.image }}
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          MIGRATOR_DIGEST: ${{ steps.migrator.outputs.digest }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          bundle="dist/production-release"
          mkdir -p "$bundle/scripts" "$bundle/docs"
          {
            printf 'PAYLOAD_IMAGE=%s@%s\n' "$IMAGE" "$APP_DIGEST"
            printf 'PAYLOAD_MIGRATOR_IMAGE=%s@%s\n' "$IMAGE" "$MIGRATOR_DIGEST"
            printf 'RELEASE_REVISION=%s\n' "$RELEASE_REVISION"
          } > "$bundle/production-images.env"

          cp compose.prod.yml .env.production.example "$bundle/"
          cp \
            scripts/production-common.sh \
            scripts/deploy-production.sh \
            scripts/backup-production.sh \
            scripts/restore-production.sh \
            "$bundle/scripts/"
          cp docs/production-operations.md "$bundle/docs/"
          chmod 755 "$bundle/scripts/"*.sh

          (
            cd "$bundle"
            sha256sum \
              production-images.env \
              compose.prod.yml \
              .env.production.example \
              scripts/production-common.sh \
              scripts/deploy-production.sh \
              scripts/backup-production.sh \
              scripts/restore-production.sh \
              docs/production-operations.md \
              > SHA256SUMS
          )
          tar -C dist -czf "dist/production-release-${RELEASE_REVISION}.tar.gz" production-release

      - name: Upload deployment bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-${{ github.sha }}
          path: dist/production-release-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Add image digests to job summary
        shell: bash
        run: |
          {
            echo "### Production images"
            echo
            echo "- App: \`${{ steps.refs.outputs.image }}@${{ steps.app.outputs.digest }}\`"
            echo "- Migrator: \`${{ steps.refs.outputs.image }}@${{ steps.migrator.outputs.digest }}\`"
            echo "- Deployment bundle: \`production-release-${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
