name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.13.0"
  PNPM_VERSION: "10.28.1"

jobs:
  quality:
    name: Quality Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Takumi Guard
        uses: flatt-security/setup-takumi-guard-npm@9a5d797c2085b6326d3a2985c08e3a114b9b88c1 # v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Oxfmt Check
        run: pnpm run fmt:check

      - name: Oxlint Check
        run: pnpm run lint

      - name: TypeScript Check
        run: pnpm run typecheck

  react-doctor:
    name: React Doctor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch main branch
        run: |
          if [ "$(git rev-parse --abbrev-ref HEAD)" != "main" ]; then
            git fetch origin main:main
          fi

      - name: Run React Doctor
        uses: millionco/react-doctor@1d3d514a562bbab42dcefa0badeed2e707ed7ea9
        with:
          directory: .
          project: 45th-homepage
          verbose: true
          diff: main
          fail-on: none
          node-version: ${{ env.NODE_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  production-stack:
    name: Production Stack
    runs-on: ubuntu-latest
    needs: [quality, react-doctor]
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: payload
      PAYLOAD_SECRET: ci_secret_key
      DATABASE_URL: postgres://postgres:mysecretpassword@postgres:5432/payload
      S3_BUCKET: media
      S3_ENDPOINT: http://seaweedfs-s3:8333
      S3_ACCESS_KEY_ID: ci_access_key
      S3_SECRET_ACCESS_KEY: ci_secret_key
      S3_REGION: us-east-1
      HEALTH_CHECK_KEY: ci_health_key
      CLOUDFLARE_TUNNEL_TOKEN: ci_tunnel_token
      NEXT_PUBLIC_SITE_URL: https://example.com/
      PAYLOAD_IMAGE: 45th-homepage:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare production environment
        run: |
          printf '%s\n' \
            "POSTGRES_USER=$POSTGRES_USER" \
            "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" \
            "POSTGRES_DB=$POSTGRES_DB" \
            "DATABASE_URL=$DATABASE_URL" \
            "PAYLOAD_SECRET=$PAYLOAD_SECRET" \
            "S3_BUCKET=$S3_BUCKET" \
            "S3_ACCESS_KEY_ID=$S3_ACCESS_KEY_ID" \
            "S3_SECRET_ACCESS_KEY=$S3_SECRET_ACCESS_KEY" \
            "S3_ENDPOINT=$S3_ENDPOINT" \
            "S3_REGION=$S3_REGION" \
            "HEALTH_CHECK_KEY=$HEALTH_CHECK_KEY" \
            "CLOUDFLARE_TUNNEL_TOKEN=$CLOUDFLARE_TUNNEL_TOKEN" \
            "NEXT_PUBLIC_SITE_URL=$NEXT_PUBLIC_SITE_URL" \
            > .env.production
          printf 'PAYLOAD_IMAGE=%s\n' "$PAYLOAD_IMAGE" > .env.release

      - name: Validate Compose
        run: docker compose --env-file .env.production --env-file .env.release -f compose.prod.yml config -q

      - name: Build Payload image
        run: docker compose --env-file .env.production --env-file .env.release -f compose.prod.yml build payload

      - name: Start PostgreSQL and SeaweedFS
        run: docker compose --env-file .env.production --env-file .env.release -f compose.prod.yml up -d --wait --wait-timeout 120 postgres seaweedfs-s3

      - name: Run migrations
        run: docker compose --env-file .env.production --env-file .env.release -f compose.prod.yml --profile tools run --rm --no-deps payload-migrate

      - name: Start Payload
        run: docker compose --env-file .env.production --env-file .env.release -f compose.prod.yml up -d --no-deps --wait --wait-timeout 120 payload

      - name: Verify strict health check
        run: |
          docker compose --env-file .env.production --env-file .env.release -f compose.prod.yml exec -T payload \
            node -e 'fetch("http://127.0.0.1:3000/api/health?strict=1", { headers: { "x-health-key": process.env.HEALTH_CHECK_KEY } }).then(async (response) => { console.log(await response.text()); process.exit(response.status === 200 ? 0 : 1); }).catch((error) => { console.error(error); process.exit(1); })'

      - name: Verify logical media backup metadata
        run: |
          mkdir -m 700 -p backups
          docker compose --env-file .env.production --env-file .env.release -f compose.prod.yml \
            --profile tools run --rm --no-deps --entrypoint node media-tool \
            --input-type=module -e '
              import { PutObjectCommand, S3Client } from "@aws-sdk/client-s3";
              const client = new S3Client({
                credentials: {
                  accessKeyId: process.env.S3_ACCESS_KEY_ID,
                  secretAccessKey: process.env.S3_SECRET_ACCESS_KEY,
                },
                endpoint: process.env.S3_ENDPOINT,
                forcePathStyle: true,
                region: process.env.S3_REGION,
              });
              await client.send(new PutObjectCommand({
                Body: Buffer.from("metadata-roundtrip"),
                Bucket: process.env.S3_BUCKET,
                ContentType: "image/x-ci-roundtrip",
                Key: "metadata-roundtrip.bin",
              }));
            '
          docker compose --env-file .env.production --env-file .env.release -f compose.prod.yml stop payload
          scripts/prod/backup.sh
          backup_dir="$(
            node -e '
              const fs = require("node:fs");
              const path = require("node:path");
              const backups = fs.readdirSync("backups")
                .filter((name) => fs.existsSync(path.join("backups", name, "COMPLETE")))
                .sort();
              if (backups.length === 0) process.exit(1);
              process.stdout.write(path.join("backups", backups.at(-1)));
            '
          )"
          scripts/prod/media-tool.sh upload "$backup_dir/media"
          BACKUP_DIR="$backup_dir" node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const manifest = JSON.parse(
              fs.readFileSync(path.join(process.env.BACKUP_DIR, "media-metadata.json"), "utf8"),
            );
            const fixture = manifest.find(({ key }) => key === "metadata-roundtrip.bin");
            if (
              !fixture ||
              fixture.size !== Buffer.byteLength("metadata-roundtrip") ||
              fixture.contentType !== "image/x-ci-roundtrip"
            ) {
              throw new Error("Media Content-Type was not preserved");
            }
          '
      - name: Show container logs
        if: failure()
        run: docker compose --env-file .env.production --env-file .env.release -f compose.prod.yml logs

      - name: Stop test stack
        if: always()
        run: docker compose --env-file .env.production --env-file .env.release -f compose.prod.yml down -v
