# ============================================================
# Docker Compose — Production-like Lighthouse performance test
# ============================================================
# Run:
#   docker compose --env-file .env.production -f compose.perf.yml up --build --abort-on-container-exit --exit-code-from lighthouse
#
# Optional:
#   LIGHTHOUSE_URLS="http://payload:3000/ http://payload:3000/news" docker compose --env-file .env.production -f compose.perf.yml up --build --abort-on-container-exit --exit-code-from lighthouse
# ============================================================

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=200"]
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - perf-pgdata:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - perf-internal

  seaweedfs-master:
    image: chrislusf/seaweedfs:4.18
    restart: unless-stopped
    command: master -ip=seaweedfs-master -volumeSizeLimitMB=1024 -ip.bind=0.0.0.0
    volumes:
      - perf-seaweedfs-master-data:/data
    expose:
      - "9333"
      - "19333"
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - perf-internal

  seaweedfs-volume:
    image: chrislusf/seaweedfs:4.18
    restart: unless-stopped
    command: volume -mserver=seaweedfs-master:9333 -ip=seaweedfs-volume -port=8080 -max=0 -preStopSeconds=1 -ip.bind=0.0.0.0
    volumes:
      - perf-seaweedfs-volume-data:/data
    depends_on:
      seaweedfs-master:
        condition: service_healthy
    expose:
      - "8080"
      - "18080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/status > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - perf-internal

  seaweedfs-filer:
    image: chrislusf/seaweedfs:4.18
    restart: unless-stopped
    command: filer -master=seaweedfs-master:9333 -ip=seaweedfs-filer -ip.bind=0.0.0.0
    volumes:
      - perf-seaweedfs-filer-data:/data
    depends_on:
      seaweedfs-master:
        condition: service_healthy
      seaweedfs-volume:
        condition: service_healthy
    expose:
      - "8888"
      - "18888"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8888/ > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - perf-internal

  seaweedfs-s3:
    image: chrislusf/seaweedfs:4.18
    restart: unless-stopped
    command: "s3 -filer=seaweedfs-filer:8888 -ip.bind=0.0.0.0"
    depends_on:
      seaweedfs-filer:
        condition: service_healthy
    expose:
      - "8333"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -Eq 'HTTP/[0-9.]+ (200|403)'",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - perf-internal

  payload:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${PAYLOAD_IMAGE:-45th-homepage:local}
    restart: unless-stopped
    stop_grace_period: 30s
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      S3_ENDPOINT: http://seaweedfs-s3:8333
      HEALTH_CHECK_KEY: ${HEALTH_CHECK_KEY:?HEALTH_CHECK_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const http = require(''http''); const req = http.request(''http://127.0.0.1:3000/api/health?strict=1'', { headers: { ''x-health-key'': process.env.HEALTH_CHECK_KEY } }, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on(''error'', () => process.exit(1)); req.end();"',
        ]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - perf-internal

  lighthouse:
    build:
      context: .
      dockerfile: Dockerfile.lighthouse
    depends_on:
      payload:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /reports
        rm -f /reports/*.report.html /reports/*.report.json

        index=0
        for url in $$LIGHTHOUSE_URLS; do
          index=$$((index + 1))
          slug=$$(printf "%s" "$$url" | sed -E "s#^https?://##; s#[^A-Za-z0-9._-]+#-#g; s#(^-|-$)##g")
          output_path="/reports/$$(printf "%02d" "$$index")-$${slug}"
          lighthouse "$$url" \
            --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" \
            --output=html \
            --output=json \
            --output-path="$$output_path"
        done
    environment:
      LIGHTHOUSE_URLS: ${LIGHTHOUSE_URLS:-http://payload:3000/}
      LIGHTHOUSE_DISABLE_ERROR_REPORTING: "1"
    volumes:
      - ./reports/lighthouse:/reports
    networks:
      - perf-internal

volumes:
  perf-pgdata:
  perf-seaweedfs-master-data:
  perf-seaweedfs-volume-data:
  perf-seaweedfs-filer-data:

networks:
  perf-internal:
    driver: bridge
