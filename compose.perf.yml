# ============================================================
# Docker Compose — Production-like Lighthouse performance test
# ============================================================
# Run:
#   mise run prod:perf
#
# Optional:
#   LIGHTHOUSE_URLS="http://payload:3000/ http://payload:3000/news" mise run prod:perf
# ============================================================

name: 45th-homepage-perf

services:
  postgres:
    image: postgres:18.4-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - perf-pgdata:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - perf-internal

  seaweedfs-s3:
    image: chrislusf/seaweedfs:4.29
    restart: unless-stopped
    stop_grace_period: 30s
    command:
      - mini
      - -dir=/data
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.iam=false
      - -s3.allowDeleteBucketNotEmpty=false
      - -admin.ui=false
      - -admin.password=${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    expose:
      - "8333"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
    volumes:
      - perf-seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/status > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - perf-internal

  payload-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    image: 45th-homepage-migrator:perf
    restart: "no"
    environment:
      NODE_ENV: production
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ENDPOINT: http://seaweedfs-s3:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - perf-internal

  payload:
    build:
      context: .
      dockerfile: Dockerfile
    image: 45th-homepage:perf
    restart: unless-stopped
    stop_grace_period: 30s
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_ENDPOINT: http://seaweedfs-s3:8333
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      HEALTH_CHECK_KEY: ${HEALTH_CHECK_KEY:?HEALTH_CHECK_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const http = require(''http''); const req = http.request(''http://127.0.0.1:3000/api/health?strict=1'', { headers: { ''x-health-key'': process.env.HEALTH_CHECK_KEY } }, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on(''error'', () => process.exit(1)); req.end();"',
        ]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 3
    networks:
      - perf-internal

  lighthouse:
    build:
      context: .
      dockerfile: Dockerfile.lighthouse
    depends_on:
      payload:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /reports
        rm -f /reports/*.report.html /reports/*.report.json

        skip_audits=""
        if [ -n "$$LIGHTHOUSE_SKIP_AUDITS" ]; then
          skip_audits="--skip-audits=$$LIGHTHOUSE_SKIP_AUDITS"
        fi

        index=0
        for url in $$LIGHTHOUSE_URLS; do
          index=$$((index + 1))
          slug=$$(printf "%s" "$$url" | sed -E "s#^https?://##; s#[^A-Za-z0-9._-]+#-#g; s#(^-|-$)##g")
          output_path="/reports/$$(printf "%02d" "$$index")-$${slug}"
          lighthouse "$$url" \
            --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage" \
            $$skip_audits \
            --output=html \
            --output=json \
            --output-path="$$output_path"
        done
    environment:
      LIGHTHOUSE_URLS: ${LIGHTHOUSE_URLS:-http://payload:3000/}
      LIGHTHOUSE_SKIP_AUDITS: ${LIGHTHOUSE_SKIP_AUDITS:-is-on-https,redirects-http}
      LIGHTHOUSE_DISABLE_ERROR_REPORTING: "1"
    volumes:
      - ./reports/lighthouse:/reports
    networks:
      - perf-internal

volumes:
  perf-pgdata:
  perf-seaweedfs-data:

networks:
  perf-internal:
    driver: bridge
