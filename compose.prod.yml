# Single-host production stack.
#
# Application images are built by GitHub Actions and must be supplied as
# immutable digest references through .env.production.images.
# Use scripts/deploy-production.sh instead of running `compose up` directly.

name: 45th-homepage

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-payload-environment: &payload-environment
  NODE_ENV: production
  PAYLOAD_SECRET: ${PAYLOAD_SECRET:?PAYLOAD_SECRET is required}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
  S3_ENDPOINT: http://seaweedfs-s3:8333
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
  HEALTH_CHECK_KEY: ${HEALTH_CHECK_KEY:?HEALTH_CHECK_KEY is required}
  RELEASE_REVISION: ${RELEASE_REVISION:?RELEASE_REVISION is required}

services:
  postgres:
    image: postgres:18.4-alpine3.23
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pgdata:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
    logging: *default-logging

  # The service name is kept as the stable internal S3 endpoint. The process
  # itself is the single-node weed mini stack (master, volume, filer, and S3).
  seaweedfs-s3:
    image: chrislusf/seaweedfs:4.29
    restart: unless-stopped
    stop_grace_period: 30s
    command:
      - mini
      - -dir=/data
      - -webdav=false
      - -s3.port.iceberg=0
      - -s3.iam=false
      - -s3.allowDeleteBucketNotEmpty=false
      - -admin.ui=false
      - -admin.password=${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
    volumes:
      - seaweedfs-data:/data
    expose:
      - "8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8333/status > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # One-shot migration job. It is explicitly invoked only after the old
  # Payload container has stopped.
  payload-migrate:
    image: ${PAYLOAD_MIGRATOR_IMAGE:?PAYLOAD_MIGRATOR_IMAGE digest is required}
    profiles:
      - tools
    restart: "no"
    init: true
    environment:
      <<: *payload-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  payload:
    image: ${PAYLOAD_IMAGE:?PAYLOAD_IMAGE digest is required}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    expose:
      - "3000"
    environment:
      <<: *payload-environment
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs-s3:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "const http = require(''http''); const req = http.request(''http://127.0.0.1:3000/api/health?strict=1'', { headers: { ''x-health-key'': process.env.HEALTH_CHECK_KEY } }, (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on(''error'', () => process.exit(1)); req.end();"',
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  cloudflared:
    image: cloudflare/cloudflared:2026.3.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
      TUNNEL_METRICS: 127.0.0.1:60123
    depends_on:
      payload:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks:
      - internal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  # On-demand S3 client used by backup, restore, and post-deploy smoke tests.
  # It is not part of the long-running stack.
  media-tool:
    image: amazon/aws-cli:2.36.9
    profiles:
      - tools
    entrypoint:
      - aws
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is required}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
      HOME: /tmp
    volumes:
      - type: bind
        source: ${BACKUP_DIR:?BACKUP_DIR is required}
        target: /backups
    networks:
      - internal
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  seaweedfs-data:

networks:
  internal:
    driver: bridge
